# Nginx Configuration Template for WACRM Public REST API
# Domain: api.resend.in (Configurable via environment)
# Backend: Node.js Express on 127.0.0.1:${BACKEND_PORT}

# Upstream Backend Pool
upstream wacrm_api_backend {
    server 127.0.0.1:3001; # Matches BACKEND_PORT (default 3001/3010)
    keepalive 32;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name api.resend.in;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.resend.in;

    # SSL Certificates (Configure paths appropriately)
    ssl_certificate /etc/letsencrypt/live/api.resend.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.resend.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client body limit for media uploads
    client_max_body_size 25M;

    # Proxy all public developer API traffic directly to Node.js backend
    # Notice: Next.js is completely bypassed for api.resend.in traffic!
    location / {
        proxy_pass http://wacrm_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Timeouts
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
