name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resend-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify deployment scope
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          TARGET_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -Eeuo pipefail
          frontend=false; backend=false; shared=false
          if [[ "$EVENT_NAME" == workflow_dispatch || ! "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            frontend=true; backend=true; shared=true
          else
            files="$(git diff --name-only "$BEFORE_SHA" "$TARGET_SHA")"
            grep -qE '^frontend/' <<<"$files" && frontend=true || true
            grep -qE '^backend/' <<<"$files" && backend=true || true
            grep -qE '^(ecosystem\.production\.config\.cjs|scripts/deploy-production\.sh|\.github/workflows/deploy-production\.yml)$' <<<"$files" && shared=true || true
            [[ "$shared" == true ]] && { frontend=true; backend=true; }
          fi
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "shared=$shared" >> "$GITHUB_OUTPUT"
          echo "Deploying commit $TARGET_SHA; frontend=$frontend backend=$backend shared=$shared"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Validate frontend
        if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          set -Eeuo pipefail
          echo 'Installing frontend dependencies from package-lock.json; npm cache is enabled.'
          npm ci
          npm run typecheck
          npm run lint
          echo 'Building validation artifact; the server rebuild uses its private production environment.'
          npm run build

      - name: Validate backend dependency graph
        if: steps.changes.outputs.backend == 'true'
        working-directory: backend
        run: npm ci --omit=dev --ignore-scripts

      - name: Configure and verify SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          expected_deploy_key_fingerprint='SHA256:MAxqUTyBIesStVe10ZwlTvcTxZgYAgBuOnz18FIO5nw'
          expected_host_key_fingerprint='SHA256:SCM5LaQAcjQcSZNYZAuVr1wf2G7zMCd/zDSZzjA0jQM'
          for required in DEPLOY_HOST DEPLOY_USER DEPLOY_PORT DEPLOY_SSH_KEY SSH_KNOWN_HOSTS; do
            [[ -n "${!required}" ]] || { echo "::error::Required deployment secret is not configured: $required"; exit 1; }
          done
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] && (( DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535 )) || { echo '::error::DEPLOY_PORT must be a valid TCP port.'; exit 1; }
          install -m 700 -d ~/.ssh
          umask 077
          # GitHub secrets can retain CRLF line endings. Remove only CR bytes
          # and add one final LF so OpenSSH's PEM parser receives valid input.
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub || { echo '::error::DEPLOY_SSH_KEY is not a parseable private key.'; exit 1; }
          actual_deploy_key_fingerprint="$(ssh-keygen -lf ~/.ssh/id_ed25519.pub -E sha256 | awk '{print $2}')"
          [[ "$actual_deploy_key_fingerprint" == "$expected_deploy_key_fingerprint" ]] || { echo '::error::DEPLOY_SSH_KEY does not match the expected deployment-key fingerprint.'; exit 1; }
          rm -f ~/.ssh/id_ed25519.pub
          known_host="$DEPLOY_HOST"; [[ "$DEPLOY_PORT" == 22 ]] || known_host="[$DEPLOY_HOST]:$DEPLOY_PORT"
          known_host_record="$(mktemp)"
          ssh-keygen -F "$known_host" -f ~/.ssh/known_hosts > "$known_host_record" || { rm -f "$known_host_record"; echo "::error::SSH_KNOWN_HOSTS has no verified entry for $known_host."; exit 1; }
          ssh-keygen -lf "$known_host_record" -E sha256 | awk '{print $2}' | grep -Fx "$expected_host_key_fingerprint" >/dev/null || { rm -f "$known_host_record"; echo '::error::SSH_KNOWN_HOSTS does not contain the expected server host-key fingerprint.'; exit 1; }
          rm -f "$known_host_record"
          echo "Verified deployment key and known-hosts entry for $known_host."

      - name: Test SSH authentication
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -Eeuo pipefail
          echo 'Testing authenticated SSH connection without running deployment commands.'
          ssh -i ~/.ssh/id_ed25519 -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" 'true'
          echo 'SSH authentication succeeded.'

      - name: Deploy validated commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          echo "Starting server deployment for commit: $DEPLOY_SHA"
          ssh -i ~/.ssh/id_ed25519 -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_SHA='$DEPLOY_SHA' /var/www/Resend/scripts/deploy-production.sh"
